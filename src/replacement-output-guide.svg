<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565"><rect width="960" height="565" rx="16" fill="#f3f8fb"/><rect x="20" y="20" width="920" height="525" rx="12" fill="white" stroke="#cbdde8"/><text x="42" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087e70">Ví dụ minh họa file nhập MISA và báo cáo riêng</text><rect x="35" y="86" width="890" height="38" fill="#fff"/><text x="47" y="112" font-family="Arial,sans-serif" font-size="18" fill="#253c53">FILE NHẬP MISA — 22 CỘT THEO MẪU NHÚNG</text><rect x="35" y="126" width="890" height="38" fill="#f2f8f7"/><text x="47" y="152" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Thông tin hóa đơn mới + người mua + thanh toán</text><rect x="35" y="166" width="890" height="38" fill="#fff"/><text x="47" y="192" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Ký hiệu HĐ gốc | Số HĐ gốc | Ngày HĐ gốc</text><rect x="35" y="206" width="890" height="38" fill="#f2f8f7"/><text x="47" y="232" font-family="Arial,sans-serif" font-size="18" fill="#253c53">1C26MKT | 00001993 | 01/07/2026</text><rect x="35" y="246" width="890" height="38" fill="#fff"/><text x="47" y="272" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Tên hàng | ĐVT | Số lượng | Đơn giá | Thành tiền | Thuế suất | Thuế</text><rect x="35" y="286" width="890" height="38" fill="#f2f8f7"/><text x="47" y="312" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Ví dụ sửa 10% → 8% và giữ tổng 780.000 đồng:</text><rect x="35" y="326" width="890" height="38" fill="#fff"/><text x="47" y="352" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Trước: tiền hàng 709.091 + thuế 70.909 = 780.000</text><rect x="35" y="366" width="890" height="38" fill="#f2f8f7"/><text x="47" y="392" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Sau: tiền hàng 722.222 + thuế 57.778 = 780.000</text><rect x="35" y="406" width="890" height="38" fill="#fff"/><text x="47" y="432" font-family="Arial,sans-serif" font-size="18" fill="#253c53">BÁO CÁO ĐỐI CHIẾU RIÊNG — KHÔNG THÊM CỘT VÀO MẪU MISA</text><rect x="35" y="446" width="890" height="38" fill="#f2f8f7"/><text x="47" y="472" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Gồm vị trí nguồn, trạng thái, dòng sửa, dòng giữ nguyên và lý do loại.</text><rect x="35" y="486" width="890" height="38" fill="#fff"/><text x="47" y="512" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Ảnh này là minh họa; file xuất chưa phát hành hóa đơn.</text></svg>