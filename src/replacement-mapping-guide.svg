<svg xmlns="http://www.w3.org/2000/svg" width="960" height="525" viewBox="0 0 960 525"><rect width="960" height="525" rx="16" fill="#f3f8fb"/><rect x="20" y="20" width="920" height="485" rx="12" fill="white" stroke="#cbdde8"/><text x="42" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087e70">Ví dụ nhận diện theo tên cột, không theo vị trí</text><rect x="35" y="86" width="890" height="38" fill="#fff"/><text x="47" y="112" font-family="Arial,sans-serif" font-size="18" fill="#253c53">CỘT NGUỒN → TRƯỜNG ĐÍCH → GIÁ TRỊ MẪU</text><rect x="35" y="126" width="890" height="38" fill="#f2f8f7"/><text x="47" y="152" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Số hóa đơn → Số hóa đơn → 00001993</text><rect x="35" y="166" width="890" height="38" fill="#fff"/><text x="47" y="192" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Ngày hóa đơn → Ngày hóa đơn → 01/07/2026</text><rect x="35" y="206" width="890" height="38" fill="#f2f8f7"/><text x="47" y="232" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Thuế suất (%) → Thuế suất → 10</text><rect x="35" y="246" width="890" height="38" fill="#fff"/><text x="47" y="272" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Tiền thuế GTGT → Tiền thuế → 70.909</text><rect x="35" y="286" width="890" height="38" fill="#f2f8f7"/><text x="47" y="312" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Thành tiền → Tiền trước thuế → 709.091</text><rect x="35" y="326" width="890" height="38" fill="#fff"/><text x="47" y="352" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Tổng tiền TT → Tổng thanh toán → 780.000</text><rect x="35" y="366" width="890" height="38" fill="#f2f8f7"/><text x="47" y="392" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Hai cột cùng tên? Chọn đúng cột qua giá trị mẫu.</text><rect x="35" y="406" width="890" height="38" fill="#fff"/><text x="47" y="432" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Thiếu cột bắt buộc? Sửa mapping hoặc bổ sung file nguồn.</text><rect x="35" y="446" width="890" height="38" fill="#f2f8f7"/><text x="47" y="472" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Đổi vị trí cột không làm đổi ý nghĩa; cột dư không dùng tính toán.</text></svg>