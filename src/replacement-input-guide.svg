<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565"><rect width="960" height="565" rx="16" fill="#f3f8fb"/><rect x="20" y="20" width="920" height="525" rx="12" fill="white" stroke="#cbdde8"/><text x="42" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087e70">Hai cặp file đầu vào được hỗ trợ</text><rect x="35" y="86" width="890" height="38" fill="#fff"/><text x="47" y="112" font-family="Arial,sans-serif" font-size="18" fill="#253c53">BẢN V2</text><rect x="35" y="126" width="890" height="38" fill="#f2f8f7"/><text x="47" y="152" font-family="Arial,sans-serif" font-size="18" fill="#253c53">File 1: Bảng kê chi tiết HĐ đã sử dụng</text><rect x="35" y="166" width="890" height="38" fill="#fff"/><text x="47" y="192" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Ký hiệu | Số hóa đơn | Ngày | Tên hàng | Thành tiền | Thuế suất</text><rect x="35" y="206" width="890" height="38" fill="#f2f8f7"/><text x="47" y="232" font-family="Arial,sans-serif" font-size="18" fill="#253c53">File 2: Bảng kê bán ra (mẫu quản trị)</text><rect x="35" y="246" width="890" height="38" fill="#fff"/><text x="47" y="272" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Số hóa đơn | Ngày | Mặt hàng | Doanh số trước thuế | Thuế suất</text><rect x="35" y="286" width="890" height="38" fill="#f2f8f7"/><text x="47" y="312" font-family="Arial,sans-serif" font-size="18" fill="#253c53">BẢN GỐC</text><rect x="35" y="326" width="890" height="38" fill="#fff"/><text x="47" y="352" font-family="Arial,sans-serif" font-size="18" fill="#253c53">File 1: Sổ chi tiết bán hàng</text><rect x="35" y="366" width="890" height="38" fill="#f2f8f7"/><text x="47" y="392" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Số hóa đơn | Mã hàng | Số lượng | Thành tiền trước thuế | Thuế</text><rect x="35" y="406" width="890" height="38" fill="#fff"/><text x="47" y="432" font-family="Arial,sans-serif" font-size="18" fill="#253c53">File 2: Danh sách hàng hóa</text><rect x="35" y="446" width="890" height="38" fill="#f2f8f7"/><text x="47" y="472" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Mã hàng | Tên hàng | Thuế suất</text><rect x="35" y="486" width="890" height="38" fill="#fff"/><text x="47" y="512" font-family="Arial,sans-serif" font-size="18" fill="#253c53">Kéo thả hai file cùng lúc — mẫu MISA đã có sẵn.</text></svg>