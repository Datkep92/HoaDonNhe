name: Release

# Phát hành khi push tag dạng vX.Y.Z (ví dụ v1.0.0).
# Tên file phát hành duy nhất: CN-Tax-Tools-Setup-vX.Y.Z.exe
#
# Chạy tay (Actions > Release > Run workflow) để BUILD THỬ mà không phát hành:
#   - nhập version (vd 1.0.0), để publish = false -> chỉ build + lưu artifact.
#   - publish = true -> tạo luôn GitHub Release công khai.
on:
  push:
    tags:
      - 'v*'
      - 'cntax-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version để build thử (vd 1.0.0). Bắt buộc khi chạy tay.'
        required: false
        default: ''
      publish:
        description: 'Tạo GitHub Release công khai?'
        type: boolean
        default: false

# Cần quyền tạo Release + upload asset.
permissions:
  contents: write

# Không chạy chồng nhiều tag cùng lúc.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    # Bắt buộc chạy trên Windows vì cần pkg (target win-x64), makensis và vá PE header.
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Một mình Node 24 cho cả test lẫn build:
      #   - test dùng `--test-isolation=none`, flag chỉ có từ Node 24 (Node 22 báo "bad option").
      #   - pkg 5.8.1 chạy tốt trên Node 24 với `--no-bytecode --public` (đã kiểm chứng ở máy).
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Lấy version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag CN Tax Tools có tiền tố thương hiệu: `cntax-v1.0.0` ⇒ app/build dùng version thuần `1.0.0`.
          $raw = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME }
          $version = $raw.Trim() -replace '^cntax-v', '' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Không xác định được version hợp lệ (nhận '$version'). Push tag dạng vX.Y.Z hoặc cntax-vX.Y.Z, hoặc nhập 'version' khi chạy tay."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version phát hành: $version"

      - name: Cài dependencies
        run: npm ci

      - name: Đồng bộ version theo tag (tag là nguồn chính)
        run: node tools/set-version.cjs ${{ steps.version.outputs.version }}

      - name: Chạy test
        run: npm test

      # Model OCR (~54 MB) KHÔNG nằm trong git (.gitignore: src/onnx/). Nếu thiếu, pkg chỉ CẢNH BÁO
      # rồi vẫn xuất EXE khuyết — mọi bản phát hành trước đây tải về KHÔNG giải được CAPTCHA.
      # Nguồn là prerelease `ocr-model-v1` của chính repo này (không phải bản phát hành sản phẩm;
      # prerelease nên không bao giờ thành "latest" và bộ tự cập nhật trong app không thấy nó).
      - name: Tải model OCR (src/onnx)
        run: npm run fetch-onnx

      - name: Build app EXE (pkg + ẩn console)
        run: npm run build

      - name: Kiểm tra EXE không cần Node trong PATH
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $savedTaskPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $exe = (Resolve-Path "release/CN-Tax-Tools-v$($env:VERSION).exe").Path
            $check = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput 'release/no-node-smoke.json' -RedirectStandardError 'release/no-node-smoke-error.txt'
            if ($check.ExitCode -ne 0) { throw "EXE smoke failed without Node in PATH: $($check.ExitCode)" }
            $result = Get-Content 'release/no-node-smoke.json' -Raw | ConvertFrom-Json
            if (-not $result.ok -or -not $result.aiRuntime -or -not $result.invoiceReplacement.worker) { throw 'EXE missing required runtime' }
          } finally { $env:PATH = $savedTaskPath }

      # Payload cho SELF-UPDATE: chính binary này được app tải về và thay tại chỗ.
      - name: Tính SHA-256 cho payload self-update
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $binary = "release/CN-Tax-Tools-v$($env:VERSION).exe"
          if (-not (Test-Path $binary)) { throw "Thiếu $binary" }
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          "$hash  CN-Tax-Tools-v$($env:VERSION).exe" | Set-Content -Path "$binary.sha256" -Encoding ascii
          Write-Host "self-update payload: $binary -> $hash"

      - name: Cài NSIS
        run: choco install nsis -y --no-progress

      - name: Đóng gói Setup EXE + SHA-256
        run: npm run installer

      - name: Upload artifact dự phòng (nếu Release lỗi vẫn có file để tải)
        uses: actions/upload-artifact@v4
        with:
          name: CN-Tax-Tools-v${{ steps.version.outputs.version }}
          path: |
            release/CN-Tax-Tools-Setup-v${{ steps.version.outputs.version }}.exe
            release/CN-Tax-Tools-Setup-v${{ steps.version.outputs.version }}.exe.sha256
            release/CN-Tax-Tools-v${{ steps.version.outputs.version }}.exe
            release/CN-Tax-Tools-v${{ steps.version.outputs.version }}.exe.sha256

      - name: Tạo GitHub Release và upload (Setup + self-update)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Giữ nguyên tag đã push (vX.Y.Z hoặc cntax-vX.Y.Z); chỉ tự đặt tag khi chạy tay.
          $tag = if ($env:REF_NAME -match '^(cntax-)?v\d') { $env:REF_NAME } else { "v$($env:VERSION)" }
          $setup = "release/CN-Tax-Tools-Setup-v$($env:VERSION).exe"
          $binary = "release/CN-Tax-Tools-v$($env:VERSION).exe"
          # Ưu tiên ghi chú đã commit trong repo (.github/RELEASE_NOTES.md) — release/ bị
          # .gitignore nên bản sinh cục bộ không tồn tại trong checkout sạch của CI, và bản đó
          # lại chứa SHA-256 của file Setup trên máy người build, không dùng được cho CI.
          # Nhờ vậy mỗi lần phát hành đều có mục thay đổi thật thay vì một dòng tiêu đề.
          $notes = ".github/RELEASE_NOTES.md"
          if (-not (Test-Path $notes)) {
            $notes = "release/RELEASE_NOTES.md"
            Write-Warning "Khong co .github/RELEASE_NOTES.md - dung ban trong release/ neu co."
          }
          if (-not (Test-Path $notes)) {
            $notes = "release/RELEASE_NOTES.md"
            "CN Tax Tools v$($env:VERSION)" | Set-Content -Path $notes -Encoding utf8
            Write-Warning "Khong tim thay ghi chu - dung noi dung toi gian."
          }
          Write-Host "Ghi chu phat hanh: $notes"
          # A completed release may have been published manually before this run.
          # Do not overwrite binaries under an already published version.
          $existingJson = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            $required = @(
              (Split-Path $setup -Leaf), (Split-Path "$setup.sha256" -Leaf),
              (Split-Path $binary -Leaf), (Split-Path "$binary.sha256" -Leaf)
            )
            $missing = @($required | Where-Object { $_ -notin $existing.assets.name })
            if ($missing.Count -gt 0) {
              throw "Release $tag exists but is incomplete: $($missing -join ', '). Inspect existing assets before publishing."
            }
            Write-Host "Release $tag already contains all four assets. Keeping published files unchanged."
            exit 0
          }
          gh release create $tag `
            $setup "$setup.sha256" `
            $binary "$binary.sha256" `
            --title "CN Tax Tools v$($env:VERSION)" `
            --notes-file $notes
