<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Không tìm thấy trang — CN Tax Tools</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/app-icon.png">
<style>
  :root{
    --brand:#087f70; --mint:#2bd4ae; --navy:#0b1a2b;
    --ink:#0e1f33; --muted:#55697f; --bg:#f5f8fb; --line:#e2e9f1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e9f1f8; --muted:#92a6ba; --bg:#070e18; --line:#1e3149; }
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:28px;
    font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
    color:var(--muted); background:var(--bg); text-align:center;
    background-image:
      radial-gradient(48% 42% at 18% 8%, rgba(43,212,174,.20), transparent 62%),
      radial-gradient(44% 40% at 84% 92%, rgba(8,127,112,.20), transparent 64%);
  }
  .box{ max-width:520px; }
  .code{
    font-size:clamp(3.6rem,16vw,6.5rem); font-weight:800; line-height:1;
    letter-spacing:-.05em; color:var(--brand);
    background:linear-gradient(135deg,var(--brand),var(--mint));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1{ font-size:clamp(1.35rem,4.6vw,1.9rem); color:var(--ink); margin:14px 0 10px; letter-spacing:-.025em; }
  p{ font-size:1rem; line-height:1.7; margin:0 0 26px; }
  .row{ display:flex; flex-wrap:wrap; gap:11px; justify-content:center; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    min-height:50px; padding:13px 24px; border-radius:999px;
    font:inherit; font-size:.95rem; font-weight:700; text-decoration:none;
  }
  .btn--p{ background:var(--brand); color:#fff; box-shadow:0 14px 34px -12px rgba(8,127,112,.42); }
  .btn--p:hover{ background:#0a8f7e; }
  .btn--g{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn--g:hover{ border-color:var(--brand); color:var(--brand); }
  .home{ margin-top:22px; font-size:.85rem; }
  .home a{ color:var(--brand); font-weight:650; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
  <div class="box">
    <div class="code" aria-hidden="true">404</div>
    <h1>Không tìm thấy trang này</h1>
    <p>Có thể đường dẫn bị sai, hoặc trang đã được chuyển đi chỗ khác. Bạn có thể quay lại trang chủ hoặc tải ứng dụng luôn.</p>
    <div class="row">
      <a class="btn btn--p" href="/">Về trang chủ</a>
      <a class="btn btn--g" href="https://github.com/Datkep92/HoaDonNhe/releases/latest" target="_blank" rel="noopener">Tải CN Tax Tools</a>
    </div>
    <p class="home">Cần hỗ trợ? Nhắn Zalo <a href="https://zalo.me/0395995035" target="_blank" rel="noopener">039.599.5035</a></p>
  </div>
</body>
</html>
