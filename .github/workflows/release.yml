name: Release

# Phát hành khi push tag dạng vX.Y.Z (ví dụ v1.0.0).
# Tên file phát hành duy nhất: HoaDonNhe-Setup-vX.Y.Z.exe
#
# Chạy tay (Actions > Release > Run workflow) để BUILD THỬ mà không phát hành:
#   - nhập version (vd 1.0.0), để publish = false -> chỉ build + lưu artifact.
#   - publish = true -> tạo luôn GitHub Release công khai.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version để build thử (vd 1.0.0). Bắt buộc khi chạy tay.'
        required: false
        default: ''
      publish:
        description: 'Tạo GitHub Release công khai?'
        type: boolean
        default: false

# Cần quyền tạo Release + upload asset.
permissions:
  contents: write

# Không chạy chồng nhiều tag cùng lúc.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    # Bắt buộc chạy trên Windows vì cần pkg (target win-x64), makensis và vá PE header.
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Một mình Node 24 cho cả test lẫn build:
      #   - test dùng `--test-isolation=none`, flag chỉ có từ Node 24 (Node 22 báo "bad option").
      #   - pkg 5.8.1 chạy tốt trên Node 24 với `--no-bytecode --public` (đã kiểm chứng ở máy).
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Lấy version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.TrimStart('v') } else { $env:REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Không xác định được version hợp lệ (nhận '$version'). Push tag dạng vX.Y.Z, hoặc nhập 'version' khi chạy tay."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version phát hành: $version"

      - name: Cài dependencies
        run: npm ci

      - name: Đồng bộ version theo tag (tag là nguồn chính)
        run: node tools/set-version.cjs ${{ steps.version.outputs.version }}

      - name: Chạy test
        run: npm test

      - name: Build app EXE (pkg + ẩn console)
        run: npm run build

      - name: Cài NSIS
        run: choco install nsis -y --no-progress

      - name: Đóng gói Setup EXE + SHA-256
        run: npm run installer

      - name: Upload artifact dự phòng (nếu Release lỗi vẫn có file để tải)
        uses: actions/upload-artifact@v4
        with:
          name: HoaDonNhe-Setup-v${{ steps.version.outputs.version }}
          path: |
            release/HoaDonNhe-Setup-v${{ steps.version.outputs.version }}.exe
            release/HoaDonNhe-Setup-v${{ steps.version.outputs.version }}.exe.sha256

      - name: Tạo GitHub Release và upload Setup EXE
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = if ($env:REF_NAME -like 'v*') { $env:REF_NAME } else { "v$($env:VERSION)" }
          $exe = "release/HoaDonNhe-Setup-v$($env:VERSION).exe"
          $sha = "$exe.sha256"
          gh release create $tag $exe $sha --title "HoaDonNhe v$($env:VERSION)" --notes-file release/RELEASE_NOTES.md
